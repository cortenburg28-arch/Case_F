# Pomfret project sorter: all weights and rules live here.
# Change a number, re-run `python -m sorter run`, compare the outputs.

[inputs]
# One CSV per grade (Google Forms -> Responses -> Download CSV). The form does
# not ask for grade, so each sheet says which grade it is.
responses = [
  { file = "dummy_data/responses_sophomores.csv", grade = "sophomore" },
  { file = "dummy_data/responses_juniors.csv", grade = "junior" },
  { file = "dummy_data/responses_seniors.csv", grade = "senior" },
]
projects = "dummy_data/projects.csv"
roster = "dummy_data/roster.csv"           # optional: Email Address, Gender (form has no gender)
last_year = "dummy_data/last_year.csv"     # last year's final list: Email Address, Project, Role
exclusions = "dummy_data/exclusions.csv"   # leaders, freshman leaders, trip students
# On the real sheets, trip students have their destination (e.g. "japan")
# instead of an email. Leave those students out of the sorting.
non_email_means_trip = true
output_dir = "output"
output_file = "Project_Pomfret_Rosters.xlsx"

[columns]
# The form's headers are whole questions. Each setting is a distinctive piece
# of the question text; the first header containing it is used. If the form
# is reworded, only these need to change. Leave a setting "" if not asked.
id = "Email Address"
name = "What is your Name"
grade = ""                 # comes from the sheet (see [inputs])
gender = ""                # comes from the roster file
track = "Would you prefer to do a MAJOR Project"
# Checkbox questions listing projects. Google Forms separates the ticked
# options with commas; projects are found by name, so commas inside a
# project name are fine. Names in projects.csv must match the form options.
choices = [
  "connected to existing Clubs or Academic classes",
  "ran in previous years as MAJORS",
  "ran in previous years as MINORS",
  "end with a TedX performance",
  "ideas for entirely new Projects",
]
choices_ranked = false     # checkboxes: picks have no order
types = ["Please choose the TYPE of Project", "Please choose a second TYPE of Project"]
sdgs = ["Please choose a UN Sustainable Development Goals",
        "Please choose a second UN Sustainable Development Goals"]
celebration = "What do you want to do for your Celebration of Learning"
comments = "Please share anything else"

[project_columns]
id = "Project ID"
name = "Project"
track = "Major/Minor"
types = "Type tags"
sdgs = "SDG tags"
must_run = "Must run"
location = "Location"      # optional, shown on the roster sheets
faculty = "Faculty"        # optional, several names separated by commas

[grades]
# How the grade cell is recognized (case-insensitive) and the priority weight.
# A higher weight means the student's satisfaction counts more and they are
# placed earlier.
senior = { aliases = ["12", "senior", "seniors", "vi form"], weight = 4.0, order = 1 }
junior = { aliases = ["11", "junior", "juniors", "v form"], weight = 2.0, order = 2 }
sophomore = { aliases = ["10", "sophomore", "sophomores", "iv form"], weight = 1.0, order = 3 }

[selection]
majors_to_run = 14
minors_to_run = 8
minors_per_minor_student = 2
# Minors run once in week 1 and again in week 2 (GROUP 1 / GROUP 2), and a
# minor student does one minor each week. Size limits apply to each group.
minors_run_each_week = true
# Weight of a named pick when estimating demand for a project (by rank; only
# used if choices_ranked = true).
demand_rank_weights = [1.0, 0.8, 0.6, 0.45, 0.35]

[size]
min = 8            # projects ending below this are cut (unless must-run)
target_min = 10
target_max = 12
hard_max = 14      # "can go a bit bigger", but never beyond this

[scoring]
# Points a student gets for a project. Named picks always beat unnamed ones.
named_by_rank = [100, 85, 72, 60, 50]   # 1st, 2nd, 3rd... (last value repeats)
named_unranked = 80                     # every ticked project, if picks are not ranked
type_match = 12                         # per matching hands/feet/head/heart tag
type_match_cap = 24
sdg_match = 5                           # per matching SDG goal
sdg_match_cap = 15
second_choice_factor = 0.6              # 2nd type / 2nd SDG counts this much
# Students who named only one project are not rewarded for it: their named
# points are multiplied by this factor and they are placed after their grade.
single_pick_factor = 0.5
allow_repeat_if_leader = true

[penalties]
# Applied per project in the optimizer. Gender is the lowest priority.
under_min_per_student = 60
under_target_per_student = 8
over_target_per_student = 40
gender_minority_per_missing = 6   # mixed group with fewer than 3 of a gender

[optimizer]
seed = 42
max_passes = 30
